<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Film Sprocket Pattern -->
    <pattern id="sprockets" width="40" height="20" patternUnits="userSpaceOnUse">
      <rect x="10" y="4" width="20" height="12" rx="3" fill="#1f2937" stroke="#374151" stroke-width="1" />
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 44px;
      font-weight: 800;
      letter-spacing: -0.5px;
      fill: url(#titleGrad);
    }
    .subtitle-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 19px;
      font-weight: 500;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #e2e8f0;
    }
    .dynamic-orb {
      animation: float 8s ease-in-out infinite alternate;
    }
    .dynamic-orb-2 {
      animation: float-rev 10s ease-in-out infinite alternate;
    }
    .color-sweep {
      animation: sweep 12s linear infinite;
    }
    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(40px, -25px) scale(1.15); }
    }
    @keyframes float-rev {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(-35px, 20px) scale(1.1); }
    }
    @keyframes sweep {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>

  <!-- Deep Dark Base -->
  <rect width="1200" height="400" fill="url(#bgGrad)" />

  <!-- Animated Glowing Orbs (in Background) -->
  <g class="dynamic-orb">
    <circle cx="200" cy="120" r="140" fill="url(#amberGlow)" filter="url(#glow)" />
  </g>
  <g class="dynamic-orb-2">
    <circle cx="1020" cy="280" r="160" fill="url(#cyanGlow)" filter="url(#glow)" />
  </g>

  <!-- Photographic Sensor Grid lines -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="900" y1="0" x2="900" y2="400" />
  </g>

  <!-- Top Film Sprocket Strip -->
  <rect x="0" y="0" width="1200" height="24" fill="#111827" opacity="0.9" />
  <rect x="0" y="0" width="1200" height="24" fill="url(#sprockets)" />

  <!-- Bottom Film Sprocket Strip -->
  <rect x="0" y="376" width="1200" height="24" fill="#111827" opacity="0.9" />
  <rect x="0" y="376" width="1200" height="24" fill="url(#sprockets)" />

  <!-- Dynamic Color Prism Spectrum Wheel (Background accent) -->
  <g transform="translate(1030, 150)" opacity="0.35">
    <g class="color-sweep">
      <circle cx="0" cy="0" r="85" fill="none" stroke="url(#titleGrad)" stroke-width="4" stroke-dasharray="16 10" />
      <circle cx="0" cy="0" r="55" fill="none" stroke="#f43f5e" stroke-width="2" stroke-dasharray="8 6" />
      <polygon points="0,-75 65,37 -65,37" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    </g>
  </g>

  <!-- Center Foreground Content: Camera Aperture & Film Icon -->
  <g transform="translate(80, 115)">
    <!-- Aperture Badge -->
    <rect x="0" y="0" width="68" height="68" rx="18" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <path d="M 34 18 A 16 16 0 1 0 34 50 A 16 16 0 1 0 34 18" fill="none" stroke="#f59e0b" stroke-width="3.5" />
    <circle cx="34" cy="34" r="6" fill="#f43f5e" />
    <line x1="24" y1="22" x2="44" y2="46" stroke="#38bdf8" stroke-width="2" />
    <line x1="44" y1="22" x2="24" y2="46" stroke="#38bdf8" stroke-width="2" />
  </g>

  <!-- Foreground Title and Subtitles (Completely Clear & Unblocked) -->
  <text x="170" y="155" class="title-text">Awesome Computational Photography &amp; Film Simulation</text>
  <text x="170" y="195" class="subtitle-text">Curated Analog Film Emulations • 3D LUT Color Science • RAW Processing • Halation &amp; Grain Synthesis</text>

  <!-- Category Interactive Feature Pills -->
  <g transform="translate(170, 240)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="180" height="34" rx="17" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2" opacity="0.9" />
    <circle cx="16" cy="17" r="5" fill="#f59e0b" />
    <text x="30" y="22" class="badge-text">🎞️ Analog Film Stocks</text>

    <!-- Pill 2 -->
    <rect x="195" y="0" width="165" height="34" rx="17" fill="#1e293b" stroke="#f43f5e" stroke-width="1.2" opacity="0.9" />
    <circle cx="211" cy="17" r="5" fill="#f43f5e" />
    <text x="225" y="22" class="badge-text">🎨 3D LUT &amp; HaldCLUT</text>

    <!-- Pill 3 -->
    <rect x="375" y="0" width="180" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
    <circle cx="391" cy="17" r="5" fill="#38bdf8" />
    <text x="405" y="22" class="badge-text">📷 RAW Color Science</text>

    <!-- Pill 4 -->
    <rect x="570" y="0" width="170" height="34" rx="17" fill="#1e293b" stroke="#10b981" stroke-width="1.2" opacity="0.9" />
    <circle cx="586" cy="17" r="5" fill="#10b981" />
    <text x="600" y="22" class="badge-text">✨ Halation &amp; Grain</text>

    <!-- Pill 5 -->
    <rect x="755" y="0" width="180" height="34" rx="17" fill="#1e293b" stroke="#a855f7" stroke-width="1.2" opacity="0.9" />
    <circle cx="771" cy="17" r="5" fill="#a855f7" />
    <text x="785" y="22" class="badge-text">⚡ OpenColorIO &amp; ACES</text>
  </g>

  <!-- Tagline footer note inside banner -->
  <text x="170" y="325" font-family="system-ui, sans-serif" font-size="14" fill="#64748b">
    🚀 High-fidelity analog aesthetics meets modern computational imaging pipelines
  </text>
</svg>
